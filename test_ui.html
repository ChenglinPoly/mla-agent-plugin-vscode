<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>UI 测试</title>
  <style>
    body { background: #1e1e1e; color: #ccc; font-family: sans-serif; padding: 20px; }
    #messages { height: 400px; overflow-y: auto; border: 1px solid #444; padding: 10px; margin-bottom: 10px; }
    .message { margin-bottom: 15px; padding: 10px; border-radius: 5px; }
    .message.user { background: #2d2d30; border-left: 3px solid #007acc; }
    .message.assistant { background: transparent; }
    .role { font-weight: bold; margin-bottom: 8px; opacity: 0.8; }
    input { width: 80%; padding: 8px; background: #3c3c3c; color: white; border: 1px solid #555; }
    button { padding: 8px 16px; background: #0e639c; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h2>聊天 UI 测试</h2>
  <div id="messages"></div>
  <input type="text" id="input" placeholder="输入消息..." />
  <button onclick="send()">发送</button>
  <button onclick="clearAll()">清除</button>

  <script>
    const messagesDiv = document.getElementById('messages');
    const input = document.getElementById('input');

    function renderMarkdown(text) {
      if (!text) return '';
      
      let html = text;
      
      // 转义 HTML
      const tempDiv = document.createElement('div');
      tempDiv.textContent = html;
      html = tempDiv.innerHTML;
      
      // 粗体
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      
      // 行内代码
      html = html.replace(/\`([^\`]+)\`/g, '<code style="background:#333;padding:2px 4px;border-radius:3px;">$1</code>');
      
      // 换行
      html = html.replace(/\n/g, '<br>');
      
      return html;
    }

    function send() {
      const text = input.value.trim();
      if (!text) return;

      // 用户消息
      const userDiv = document.createElement('div');
      userDiv.className = 'message user';
      userDiv.innerHTML = `<div class="role">👤 用户</div><div>${escapeHtml(text)}</div>`;
      messagesDiv.appendChild(userDiv);

      // 助手消息（测试）
      const assistantDiv = document.createElement('div');
      assistantDiv.className = 'message assistant';
      const testResponse = '我将帮您处理。这是**粗体**文本，这是`代码`。\n换行测试。';
      assistantDiv.innerHTML = `<div class="role">🤖 助手</div><div>${renderMarkdown(testResponse)}</div>`;
      messagesDiv.appendChild(assistantDiv);

      input.value = '';
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function clearAll() {
      messagesDiv.innerHTML = '';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    input.onkeypress = (e) => {
      if (e.key === 'Enter') send();
    };

    // 测试初始化
    console.log('UI 测试页面加载完成');
  </script>
</body>
</html>
